name: Autonomous AI News Wire Pipeline

on:
  schedule:
    # Runs every 2 hours around the clock
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  publish-wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Newsroom Wire Ingestion Pipeline
        run: |
          python3 scripts/newsroom_wire.py

      - name: Run Automated Indexing Health Audit
        run: |
          python3 scripts/audit_indexing_health.py

      - name: Commit and Push New Wire Articles & Dedup State
        run: |
          git config user.name "AINE News Wire Bot"
          git config user.email "bot@aine.ws"
          if [ -n "$(git status --porcelain src/data/articles.ts)" ]; then
            git add src/data/articles.ts scripts/news_dedup.db
            git commit -m "chore(newsroom): ingest breaking AI wire stories [skip ci]"
            git push origin main
            echo "Successfully committed and published new breaking articles to wire."
          else
            echo "All news wire feeds are up to date. No new articles to commit."
          fi
