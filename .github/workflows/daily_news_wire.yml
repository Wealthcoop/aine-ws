name: Autonomous AI News Wire Pipeline

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  publish-wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Superhuman Newsletter Radar & Newsroom Wire Pipeline
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/superhuman_ingest.py || echo "Superhuman ingest step returned non-zero; continuing wire run."
          python3 scripts/newsroom_wire.py

      - name: Run Automated Indexing Health Audit
        run: |
          python3 scripts/audit_indexing_health.py

      - name: Commit and Push New Wire Articles, Tools & Prompts
        run: |
          git config user.name "AINE News Wire Bot"
          git config user.email "bot@aine.ws"
          if [ -n "$(git status --porcelain src/data/articles.ts src/data/trendingTools.json src/data/dailyPrompt.json)" ]; then
            git add src/data/articles.ts src/data/trendingTools.json src/data/dailyPrompt.json scripts/news_dedup.db WIRE_PUBLISHING_LEDGER.md scripts/wire_health_status.json
            git commit -m "chore(newsroom): ingest breaking AI wire stories [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push origin main; then
                echo "Successfully committed and published new breaking articles to wire."
                exit 0
              fi
              sleep 3
            done
            exit 1
          else
            echo "All news wire feeds are up to date. No new articles to commit."
          fi
